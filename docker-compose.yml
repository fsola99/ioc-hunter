services:
  backend:
    build: ./backend
    environment:
      VT_API_KEY: ${VT_API_KEY:?Set VT_API_KEY in your .env file}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
