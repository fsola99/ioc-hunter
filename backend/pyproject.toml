[project]
name = "ioc-hunter"
version = "2.0.0"
description = "Threat intelligence lookup service for hashes, IPs, domains and URLs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
