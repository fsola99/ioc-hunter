<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoC Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
    <div class="relative w-full h-full flex items-center justify-center bg-gray-500">
        <!-- Background circles -->
        <div class="absolute top-0 right-0 w-1/3 h-1/3 bg-white rounded-full"></div>
        <div class="absolute bottom-0 right-0 w-1/3 h-1/3 bg-black rounded-full"></div>
        
        <!-- Content -->
        <div class="text-center relative z-10">
            <h1 class="text-6xl font-bold text-black drop-shadow-lg">IoC Hunter</h1>
            
            <!-- API Key Input -->
            <div id="key-div" class="mt-6 flex justify-center">
                <input type="text" id="api-key-input" placeholder="Enter your VirusTotal API Key" 
                    class="w-96 p-3 text-white bg-black rounded-md focus:outline-none">
                <button onclick="setApiKey()" class="ml-2 px-4 py-3 bg-black text-white rounded-md hover:bg-gray-700">Set API Key</button>
            </div>

            <!-- IoC Input -->
            <div class="mt-6 flex justify-center">
                <input type="text" id="ioc-input" placeholder="Insert Indicator (Hash, IP Address, Or Domain)" 
                    class="w-96 p-3 text-white bg-black rounded-md focus:outline-none">
                <button onclick="searchIoC()" class="ml-2 px-4 py-3 bg-black text-white rounded-md hover:bg-gray-700">Search</button>
            </div>
            
            <!-- Download CSV Button -->
            <div id="csv-button" class="mt-4 hidden">
                <button onclick="downloadCSV()" class="px-4 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-800">Download CSV</button>
                <button onclick="clearResults()" class="ml-2 px-4 py-3 bg-red-600 text-white rounded-md hover:bg-red-800">Clear Results</button>
            </div>

            <!-- Output, initially hidden -->
            <div id="output" class="mt-6 p-4 bg-white text-black rounded-lg hidden text-left overflow-auto max-w-3xl mx-auto w-full max-h-96"></div>
        </div>
    </div>

    <script>
        function setApiKey() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            if (!apiKey) {
                alert("Please enter your VirusTotal API key.");
                return;
            }

            console.log("Setting API key...");
            fetch("/set-api-key", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ api_key: apiKey }),
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.detail); });
                }
                return response.json();
            })
            .then(data => {
                console.log("API key set successfully:", data);
                alert(data.message);
                document.getElementById("key-div").classList.add("hidden");
            })
            .catch(error => {
                console.error("Error setting API key:", error);
                alert(`Error: ${error.message}`);
            });
        }

        function searchIoC() {
            const ioc = document.getElementById('ioc-input').value.trim();
            if (!ioc) {
                alert("Please enter an indicator");
                return;
            }

            console.log("Searching IoC:", ioc);
            fetch(`/check-hash/${ioc}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.detail); });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("IoC search results:", data);
                    displayResults(data);
                    document.getElementById("output").classList.remove("hidden");
                    document.getElementById("csv-button").classList.remove("hidden");
                })
                .catch(error => {
                    console.error("Error searching IoC:", error);
                    document.getElementById("output").innerText = `Error: ${error.message}`;
                    document.getElementById("output").classList.remove("hidden");
                });
        }

        function displayResults(data) {
            const output = document.getElementById("output");
            output.innerHTML = ""; // Clear previous content

            console.log("Displaying results...");

            // Function to create collapsible sections
            const createCollapsibleSection = (title, content) => {
                const section = document.createElement("div");
                section.className = "mb-4";

                const header = document.createElement("div");
                header.className = "flex justify-between items-center bg-gray-200 p-2 rounded-t-lg cursor-pointer";
                header.innerHTML = `
                    <span class="font-bold">${title}</span>
                    <span class="text-xl">▼</span>
                `;

                const body = document.createElement("div");
                body.className = "bg-gray-100 p-2 rounded-b-lg hidden";
                body.innerHTML = content;

                header.addEventListener("click", () => {
                    body.classList.toggle("hidden");
                });

                section.appendChild(header);
                section.appendChild(body);
                return section;
            };

            // Function to format Unix timestamp to a readable date
            const formatDate = (timestamp) => {
                if (!timestamp || timestamp === "N/A") return "N/A";
                const date = new Date(timestamp * 1000);
                return date.toLocaleString();
            };

            // Function to format DNS Lookups
            const formatDNSLookups = (dnsLookups) => {
                if (!dnsLookups || dnsLookups.length === 0) return "N/A";
                return dnsLookups.map(dns => `${dns.hostname}: ${dns.resolved_ips.join(", ")}`).join("<br>");
            };

            // Display basic file information
            const basicInfo = `
                <p><strong>MD5:</strong> ${data["File Analysis"]["MD5"]}</p>
                <p><strong>SHA-1:</strong> ${data["File Analysis"]["SHA-1"]}</p>
                <p><strong>SHA-256:</strong> ${data["File Analysis"]["SHA-256"]}</p>
                <p><strong>File Type:</strong> ${data["File Analysis"]["File Type"]}</p>
                <p><strong>File Size (bytes):</strong> ${data["File Analysis"]["File Size (bytes)"]}</p>
            `;
            output.appendChild(createCollapsibleSection("File Analysis", basicInfo));

            // Display VirusTotal analysis
            const analysisInfo = `
                <p><strong>Malicious:</strong> ${data["VirusTotal Analysis"]["Malicious"]}</p>
                <p><strong>Suspicious:</strong> ${data["VirusTotal Analysis"]["Suspicious"]}</p>
                <p><strong>Undetected:</strong> ${data["VirusTotal Analysis"]["Undetected"]}</p>
                <p><strong>Tags:</strong> ${data["VirusTotal Analysis"]["Tags"]}</p>
                <p><strong>Associated Names:</strong> ${data["VirusTotal Analysis"]["Associated Names"]}</p>
            `;
            output.appendChild(createCollapsibleSection("VirusTotal Analysis", analysisInfo));

            // Display additional information
            const additionalInfo = `
                <p><strong>First Analysis Date:</strong> ${formatDate(data["Additional Information"]["First Analysis Date"])}</p>
                <p><strong>Last Analysis Date:</strong> ${formatDate(data["Additional Information"]["Last Analysis Date"])}</p>
            `;
            output.appendChild(createCollapsibleSection("Additional Information", additionalInfo));

            // Display Sandbox information
            const sandboxInfo = `
                <p><strong>Services Started:</strong> ${data["Additional Information"]["Sandbox Information"]["Services Started"].join(", ") || "N/A"}</p>
                <p><strong>Processes Created:</strong> ${data["Additional Information"]["Sandbox Information"]["Processes Created"].join(", ") || "N/A"}</p>
                <p><strong>Mutexes Created:</strong> ${data["Additional Information"]["Sandbox Information"]["Mutexes Created"].join(", ") || "N/A"}</p>
                <p><strong>DNS Lookups:</strong> ${formatDNSLookups(data["Additional Information"]["Sandbox Information"]["DNS Lookups"])}</p>
                <p><strong>Files Opened:</strong> ${data["Additional Information"]["Sandbox Information"]["Files Opened"].join(", ") || "N/A"}</p>
                <p><strong>Modules Loaded:</strong> ${data["Additional Information"]["Sandbox Information"]["Modules Loaded"].join(", ") || "N/A"}</p>
                <p><strong>Registry Keys Opened:</strong> ${data["Additional Information"]["Sandbox Information"]["Registry Keys Opened"].join(", ") || "N/A"}</p>
                <p><strong>Processes Terminated:</strong> ${data["Additional Information"]["Sandbox Information"]["Processes Terminated"].join(", ") || "N/A"}</p>
            `;
            output.appendChild(createCollapsibleSection("Sandbox Information", sandboxInfo));

            // Display financial sector information
            const financialInfo = `
                <p><strong>Is Ransomware?:</strong> ${data["Additional Information"]["Financial Sector Information"]["Is Ransomware?"]}</p>
                <p><strong>Is Banking Trojan?:</strong> ${data["Additional Information"]["Financial Sector Information"]["Is Banking Trojan?"]}</p>
                <p><strong>Is Credential Stealer?:</strong> ${data["Additional Information"]["Financial Sector Information"]["Is Credential Stealer?"]}</p>
            `;
            output.appendChild(createCollapsibleSection("Financial Sector Information", financialInfo));

            // Display MITRE TTPs
            const mitreTTPs = Object.entries(data["Additional Information"]["MITRE TTPs"]);
            if (mitreTTPs.length > 0) {
                const ttpSection = document.createElement("div");
                ttpSection.className = "mb-4";

                const ttpHeader = document.createElement("div");
                ttpHeader.className = "font-bold text-xl mb-4";
                ttpHeader.textContent = "MITRE TTPs";
                ttpSection.appendChild(ttpHeader);

                mitreTTPs.forEach(([sandbox, tactics]) => {
                    const sandboxSection = createCollapsibleSection(
                        `Sandbox: ${sandbox}`,
                        "" // Empty content, will be filled with tactics
                    );

                    tactics.forEach(tactic => {
                        const tacticSection = createCollapsibleSection(
                            `${tactic["Name"]} (${tactic["ID"]})`,
                            "" // Empty content, will be filled with techniques
                        );

                        tactic["Techniques"].forEach(technique => {
                            const techniqueSection = createCollapsibleSection(
                                `${technique["Name"]} (${technique["ID"]})`,
                                `<p><strong>Description:</strong> ${technique["Description"]}</p>`
                            );
                            tacticSection.querySelector("div:last-child").appendChild(techniqueSection);
                        });

                        sandboxSection.querySelector("div:last-child").appendChild(tacticSection);
                    });

                    ttpSection.appendChild(sandboxSection);
                });

                output.appendChild(ttpSection);
            }
        }

        function downloadCSV() {
            console.log("Downloading CSV...");
            window.location.href = "/download-csv";
        }

        function clearResults() {
            console.log("Clearing results...");
            fetch("/clear-results", { method: "DELETE" })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error clearing results');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Results cleared:", data);
                    alert(data.message);
                    document.getElementById("output").innerHTML = "";
                    document.getElementById("output").classList.add("hidden");
                    document.getElementById("csv-button").classList.add("hidden");
                })
                .catch(error => {
                    console.error("Error clearing results:", error);
                    alert(`Error: ${error.message}`);
                });
        }

        // Allow submission with Enter key
        document.getElementById("ioc-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                searchIoC();
            }
        });
    </script>
</body>
</html>
